name: Build Check Digitos CPF

on:
  push:
    paths:
      - 'api-check-cpf/**'
    tags:
      - 'cpf-v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/wesleypnascimento/api-check-cpf

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout do código
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Login no GitHub Container Registry
      # ----------------------------------------
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # 3. Extrai informações da versão
      # ----------------------------------------
      - name: Definir tag do ambiente
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV_TAG=latest" >> $GITHUB_ENV
          else
            echo "ENV_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=cpf-v(.*),group=1
            type=sha,prefix=sha-
            type=raw,value=${{ env.ENV_TAG }}

      # ----------------------------------------
      # 4. Build + Push
      # ----------------------------------------
      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./api-check-cpf
          file: ./api-check-cpf/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}