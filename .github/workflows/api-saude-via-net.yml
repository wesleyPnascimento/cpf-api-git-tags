name: Build Saude Via Net

on:
  push:
    tags:
      - 'saudevia-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Saude Via Net
    uses: ./.github/workflows/reusable-build-remote.yml
    with:
      image_name: saude-via-net
      repository: kaiofeitosa/saude_via_net_integration.git
      source_ref: main          # opcional; vazio = branch padrão do repo dele
      context: .
      dockerfile: ./Dockerfile
      tag_prefix: saudevia-v
    secrets:
      checkout_token: ${{ secrets.CLONE_EXTERNO_PAT }}   # só se o repo do Kaio for privado